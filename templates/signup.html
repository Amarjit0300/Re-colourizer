<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re Colourized</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='Style.css') }}"
    />
  </head>
  <body>
    <div class="container-fluid">
      <!-- Left Image Section -->
      <div class="image-section">
        <div
          id="imageCarousel"
          class="carousel slide w-100 h-100"
          data-bs-ride="carousel"
        >
          <div class="carousel-inner h-100">
            <div class="carousel-item active">
              <img
                src="{{ url_for('static', filename='images/colorized_fe364a93fa-b433-6b656ab03dc4.jpg') }}"
                alt="Image 1"
              />
            </div>
            <div class="carousel-item">
              <img
                src="{{ url_for('static', filename='images/colorized_565684d7-5a46-4fb9-8fd3-.jpg') }}"
                alt="Image 2"
              />
            </div>
            <div class="carousel-item">
              <img
                src="{{ url_for('static', filename='images/colorized_01d0aeef-b9af-4943-992b-f78e80348cec.jpg') }}"
                alt="Image 3"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Right Signup Section -->
      <div class="login-section">
        <div class="login-content">
          <!-- Re Colorizer Heading -->
          <h1
            class="text-center"
            style="font-weight: bold; font-size: 3rem; margin-bottom: 20px"
          >
            Re Colorizer
          </h1>

          <p class="welcome-text">Create Your Account:</p>

          <!-- Signup Form -->
          <div class="login-box">
            <form action="/signup" method="POST">
              <!-- Username Input -->
              <div class="mb-3">
                <div class="input-group">
                  <input
                    type="text"
                    id="Username"
                    name="username"
                    class="form-control"
                    placeholder="Username"
                    required
                  />
                  <span class="input-group-text">🆔</span>
                </div>
              </div>

              <!-- Email Input -->
              <div class="mb-3">
                <div class="input-group">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Email"
                    required
                  />
                  <span class="input-group-text">@</span>
                </div>
              </div>

              <!-- Password Input -->
              <div class="mb-3">
                <div class="input-group">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Password"
                    required
                  />
                  <span class="input-group-text">🔒</span>
                </div>
              </div>

              <!-- Submit Button and Link to Login -->
              <div class="d-grid gap-3">
                <button type="submit" class="btn btn-primary fw-semibold">
                  Sign up
                </button>
                <a href="{{ url_for('login') }}" class="btn btn-outline-primary"
                  >Already have an account? Login</a
                >
              </div>
            </form>
          </div>
        </div>

        <div class="footer-text">
          <div class="footer-box">
            <strong>Designed by</strong> : <span>Amarjit Singh</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="successModalLabel">Sign Up Successful!</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            You have successfully created an account. You can now log in.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Trigger Success Modal -->
    <script>
      if (window.location.search.includes('success=true')) {
        var myModal = new bootstrap.Modal(document.getElementById('successModal'));
        myModal.show();
      }
    </script>
  </body>
</html>
